name: Publish Android Runtime

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New immutable runtime release tag
        required: true
        default: android-runtime-5.16.1-r1

permissions:
  contents: write

concurrency:
  group: publish-android-runtime
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned NDK
        run: sdkmanager "ndk;27.0.12077973"
      - name: Build locked source and verify all ELF files
        run: |
          python3 MaaFramework-Android/tools/build_16k_runtime.py --kind go \
            --go-source-lock tools/agent-source.lock.json --output dist/runtime
          python3 MaaFramework-Android/tools/package_android_runtime.py \
            --runtime-dir dist/runtime --output dist/maaend-android-runtime-arm64-v8a-5.16.1.zip
      - name: Publish immutable archive and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --target "$GITHUB_SHA" \
            --title "MaaEnd Android Runtime $RELEASE_TAG" --latest=false \
            --notes "MaaFramework 5.16.1 with source-locked Android Go agents. Every bundled ELF passes 16 KiB LOAD and RELRO checks."
